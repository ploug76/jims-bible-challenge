 const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=vg;g.fillRect(0,0,W,H)}
// ---------- levels
function plan(n){const q=Math.min(6,1+n),t=Math.min(4,2+Math.floor(n/2)),mx=10*q+t;return{q,t,max:mx,target:Math.min(10+8*(n-1),mx-6),pool:Math.min(VERSES.length,12+8*n)}}
function startGame(lv){score=0;SND.start();startLevel(lv)}
function startLevel(lv){level=lv;const p=plan(lv);target=p.target;maxPts=p.max;lvStart=score;lvPts=0;up=[];lock=false;clearTimeout(mmT);
 const idx=shuffle([...Array(VERSES.length).keys()]),quads=shuffle(idx.filter(i=>i<p.pool)).slice(0,p.q),rest=idx.filter(i=>!quads.includes(i)).slice(0,p.t);
 cards=[];for(const v of quads)for(const k of['V','V','R','R'])cards.push({v,k});for(const v of rest){const k=R()<.5?'V':'R';cards.push({v,k},{v,k})}
 shuffle(cards);cards.forEach((c,i)=>{c.i=i;c.up=false;c.done=false});state='play';build();hud();strip();ui()}
function points(a,b){if(a.v!=b.v)return 0;return a.k==b.k?1:5}
// ---------- board
function build(){const B=$('board');B.innerHTML='';for(const c of cards){const v=VERSES[c.v],el=document.createElement('div');el.className='card';el.dataset.i=c.i;
 el.innerHTML=`<div class="in"><div class="back"><span>✝</span></div><div class="face ${c.k}"><div class="lab">${c.k=='V'?'📜 VERSE':'📖 REFERENCE'}</div><div class="tx"></div></div></div>`;
 el.querySelector('.tx').textContent=c.k=='V'?v.f:v.r;el.addEventListener('click',()=>tap(c.i));c.el=el;B.appendChild(el)}layout()}
function layout(){if(!cards.length)return;const B=$('board'),top=62,bot=118,W=innerWidth,H=innerHeight-top-bot,N=cards.length,gp=6;let bestc=null;
 for(let c=3;c<=8;c++){const r=Math.ceil(N/c),cw=Math.min((W-12-gp*(c-1))/c,(H-gp*(r-1))/r/1.25);if(!bestc||cw>bestc.cw)bestc={c,r,cw}}
 const{c,r,cw}=bestc,ch=cw*1.25,ox=(W-(c*cw+(c-1)*gp))/2,oy=(H-(r*ch+(r-1)*gp))/2;B.style.top=top+'px';B.style.height=H+'px';
 cards.forEach((k,i)=>{const e=k.el,x=i%c,y=Math.floor(i/c);Object.assign(e.style,{left:ox+x*(cw+gp)+'px',top:oy+y*(ch+gp)+'px',width:cw+'px',height:ch+'px'});
  const tx=e.querySelector('.tx');let fs=k.k=='R'?Math.min(cw/5.2,20):Math.min(cw/5.4,18);tx.style.fontSize=fs+'px';e.querySelector('.lab').style.fontSize=Math.max(6,Math.min(9,cw/11))+'px';
  let n=0;while((tx.scrollHeight>tx.clientHeight+1||tx.scrollWidth>tx.clientWidth+1)&&fs>6&&n++<50){fs-=.5;tx.style.fontSize=fs+'px'}})}
addEventListener('resize',()=>{drawBG();layout()});
function tap(i){if(state!='play'||paused)return;A();const c=cards[i];
 if(c.done||up.includes(i)){zoom(c);return}if(lock)return;
 if(up.length==2){clearTimeout(mmT);flipBack()}
 c.up=true;c.el.classList.add('up');up.push(i);SND.flip();strip();
 if(up.length==2){lock=true;setTimeout(resolve,700)}}
function resolve(){const[a,b]=up.map(i=>cards[i]),p=points(a,b);
 if(p){for(const c of[a,b]){c.done=true;c.el.classList.add('glow')}up=[];lock=false;lvPts+=p;score+=p;if(score>best){best=score;localStorage.setItem('jbcBest',best)}hud();
  setTimeout(()=>{for(const c of[a,b]){c.el.classList.remove('glow');c.el.classList.add('done')}},700);
  if(p==5){SND.five();confetti(30);setTimeout(()=>reveal(a.v),500)}else{SND.one();popT('+1 Twins!');setTimeout(checkEnd,600)}strip()}
 else{lock=false;SND.miss();for(const c of[a,b])c.el.classList.add('bad');mmT=setTimeout(()=>{flipBack();strip()},2600)}}
function flipBack(){for(const i of up){cards[i].up=false;cards[i].el.classList.remove('up','bad')}up=[]}
function checkEnd(){if(state!='play')return;if(lvPts>=target){levelDone()}else if(cards.every(c=>c.done)){retry()}}
function popT(s){const p=$('pop');p.textContent=s;p.style.opacity=1;clearTimeout(p.t);p.t=setTimeout(()=>p.style.opacity=0,900)}
function confetti(n){for(let i=0;i<n;i++){const d=document.createElement('div');d.className='conf';d.style.left=R()*100+'vw';d.style.background=['#d4a017','#ffe27a','#c0392b','#2e5e8a','#fff'][i%5];d.style.animationDelay=R()*.5+'s';d.style.animationDuration=1.4+R()*1+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
// ---------- overlays
function ov(html,after){$('box').innerHTML=html;$('ov').style.display='flex';afterOv=after||null}
function closeOv(){$('ov').style.display='none';const f=afterOv;afterOv=null;if(f)f()}
$('ov').addEventListener('click',e=>{if(e.target.id=='ov'&&$('ov').dataset.tapclose)closeOv()});
function reveal(v){const x=VERSES[v];state='reveal';ov(`<h2>✨ +5 Verse &amp; Reference! ✨</h2><div class="vs">“<span id="rvt"></span>”</div><div class="rf">— <span id="rvr"></span> (KJV)</div><button id="amen">Amen! ▶</button>`,()=>{state='play';checkEnd()});
 $('rvt').textContent=x.t;$('rvr').textContent=x.r;$('amen').onclick=closeOv}
function zoom(c){const x=VERSES[c.v];ov(c.k=='V'?`<div class="small">📜 VERSE CARD${c.done?' · matched':''}</div><div class="vs" id="zt"></div>${c.done?'<div class="rf" id="zr"></div>':''}<button id="zc">Close</button>`:`<div class="small">📖 REFERENCE CARD</div><h1 id="zt" style="margin:18px 0"></h1>${c.done?'<div class="vs" id="zr"></div>':''}<button id="zc">Close</button>`);
 $('zt').textContent=c.k=='V'?x.t:x.r;if(c.done)$('zr').textContent=c.k=='V'?'— '+x.r+' (KJV)':'“'+x.t+'”';$('zc').onclick=closeOv}
function levelDone(){state='done';SND.win();confetti(60);const p=plan(level+1);
 ov(`<h1>Hallelujah! 🎉</h1><h2>Level ${level} complete</h2><p>You earned <b>${lvPts}</b> points (target ${target}).</p><p>Total score: <b>${score}</b> · Best: ${best}</p><p>Next: ${p.q*4+p.t*2} cards, target ${p.target}</p><button id="nx">Next level ▶</button>`);$('nx').onclick=()=>{closeOv();startLevel(level+1)}}
function retry(){state='done';ov(`<h2>Board cleared!</h2><p>You scored <b>${lvPts}</b> of the <b>${target}</b> points needed.</p><p>💡 Tip: matching a <b>VERSE</b> with its <b>REFERENCE</b> earns <b>5</b> points. Twins earn only 1.</p><button id="rt">Try again ↻</button>`);
 $('rt').onclick=()=>{closeOv();score=lvStart;startLevel(level)}}
function howTo(){return`<h2>How to Play</h2><ul><li>Tap a card to flip it. Flip <b>two at a time</b>.</li><li><b>Twins</b> (the same verse twice, or the same reference twice) = <b>1 point</b>.</li><li>A <b>VERSE</b> with its correct <b>REFERENCE</b> (e.g. “For God so loved the world…” + John 3:16) = <b>5 points</b>!</li><li>Most verses appear as 2 verse cards + 2 reference cards: match them right for 10 points, or as twins for just 2.</li><li>No match? The cards flip back. Read the big text at the bottom, or tap a face-up card to zoom.</li><li>Reach the level’s points target to advance. If the board is cleared below target, try again.</li><li>Each level adds cards and raises the target.</li></ul><p class="small">Verse cards show the opening words of the verse (…). The full verse appears in the bottom strip when the card is face-up, when you tap to zoom, and on every 5-point match.</p><p class="small">${CREDIT}</p>`}
function title(){state='title';ov(`<div style="font-size:40px">📖✝🕯️</div><h1>Jim's Bible Challenge</h1><p>A Scripture memory game</p><p>Match each <b>verse</b> with its <b>reference</b> for <b>5 points</b> · twins for 1</p><p><b>Best score: ${best}</b></p><button id="go">Start ▶</button><button id="hw" class="alt">How to Play</button><br><button id="inst" class="alt" style="display:none">📲 Install app</button><div id="ios">On iPhone/iPad: tap Share ⬆ then “Add to Home Screen”</div><p class="small">${CREDIT}</p>`);
 $('go').onclick=()=>{A();closeOv();startGame(startLv)};$('hw').onclick=()=>ov(howTo()+'<button id="bk">Back</button>',null)||($('bk').onclick=title);
 $('inst').style.display=dp?'inline-block':'none';$('inst').onclick=()=>{if(dp){dp.prompt();dp=null;$('inst').style.display='none'}};$('ios').style.display=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone?'block':'none';ui()}
// ---------- HUD
function hud(){$('h1').textContent=`Level ${level} · ${lvPts} / ${target} pts`;$('h2').textContent=`Score ${score} · Best ${best}`;$('barf').style.width=Math.min(100,lvPts/target*100)+'%'}
function strip(){const s=$('strip');s.innerHTML='';if(!up.length){const d=document.createElement('div');d.className='sc hint';d.textContent=state=='play'?'Tap a card to flip it 🕯️ Match a VERSE with its REFERENCE for 5 points!':'';s.appendChild(d);return}
 for(const i of up){const c=cards[i],d=document.createElement('div');d.className='sc '+c.k;d.textContent=c.k=='V'?VERSES[c.v].t:VERSES[c.v].r;d.onclick=()=>zoom(c);s.appendChild(d)}}
function ui(){const play=state!='title';$('hud').style.display=play?'block':'none';$('board').style.display=play?'block':'none';$('strip').style.display=play?'flex':'none';
 $('pause').style.display=play?'block':'none';$('help').style.display=play?'block':'none';$('mute').style.display='block';$('mute').textContent=muted?'🔇':'🔊';$('pause').textContent=paused?'▶':'⏸';
 $('board').style.filter=paused?'blur(14px)':'';$('c3').style.display=$('c4').style.display=play?'block':'none'}
$('mute').onclick=()=>{A();muted=!muted;localStorage.setItem('jbcMute',muted?'1':'0');ui()};
$('pause').onclick=()=>{if($('ov').style.display=='flex'&&!paused)return;paused=!paused;ui();if(paused)ov('<h2>Paused</h2><p>The cards are hidden while paused.</p><button id="rs">Resume ▶</button>',()=>{paused=false;ui()}),$('rs').onclick=closeOv;else closeOv()};
$('help').onclick=()=>{if($('ov').style.display=='flex')return;const was=state;ov(howTo()+'<button id="bk">Back to game</button>');$('bk').onclick=closeOv};
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(state=='title'&&$('inst'))$('inst').style.display='inline-block'});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
drawBG();title();
</script></body></html>
